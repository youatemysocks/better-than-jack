<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>better than jack</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #fdf5e6; color: #5d4037; padding: 20px; }
        .hidden { display: none; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        
        /* Visual Meerkat Area */
        #meerkat-display { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px;
            width: 100%; 
            min-height: 200px;
            max-height: 400px;
            background: #edc9af; 
            border-radius: 15px; 
            overflow-y: auto;
            padding: 20px;
            margin: 20px 0;
            border: 4px solid #d7ccc8;
            box-sizing: border-box;
        }
        .meerkat-unit { width: 100%; border-radius: 5px; }

        #hero-image { width: 100%; max-width: 350px; border-radius: 15px; cursor: pointer; }
        .input-box { margin: 10px; display: inline-block; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #8d6e63; }
        input[type="number"] { padding: 12px; width: 100px; border: 2px solid #d7ccc8; border-radius: 8px; font-size: 16px; }
        
        button { padding: 15px 40px; font-size: 18px; font-weight: bold; cursor: pointer; background: #8d6e63; color: white; border: none; border-radius: 50px; margin: 10px; }
        
        .scrub-section { margin: 20px 0; padding: 15px; background: #f9f4f2; border-radius: 15px; }
        #yearSlider { width: 90%; accent-color: #8d6e63; cursor: pointer; }
        
        .pop-title { font-size: 1.5em; font-weight: bold; color: #5d4037; }

        .log-container { margin-top: 30px; max-height: 200px; overflow-y: auto; border: 1px solid #d7ccc8; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #8d6e63; color: white; padding: 10px; position: sticky; top: 0; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .chart-wrap { height: 400px; margin-top: 20px; }
    </style>
</head>
<body>

<div style="width: 800px; margin: auto;">
    <canvas id="popChart"></canvas>
</div>

<div class="container">
    <div id="landing">
        <h1>this website is better than jack</h1>
        <img id="hero-image" src="https://plain-enam-prod-public.komododecks.com/202605/07/0Wi7xQERl4tRS7AOEkvw/image.jpg" alt="Meerkat">
        <br><br>
        <button onclick="startSim()">start</button>
    </div>

    <div id="simScreen" class="hidden">
        <div class="pop-title">there are <span id="currentPopDisplay">20</span> meerkats</div>
        
        <div id="meerkat-display"></div>

        <div class="input-row">
            <div class="input-box"><label>births</label><input type="number" id="birthRatio" value="5"></div>
            <div class="input-box"><label>deaths</label><input type="number" id="deathRatio" value="10"></div>
            <div class="input-box"><label>years</label><input type="number" id="years" value="10"></div>
        </div>
        
        <button onclick="runSimulation()">sim</button>

        <div id="results" class="hidden">
            <div class="scrub-section">
                <label>years</label>
                <input type="range" id="yearSlider" min="0" value="0" step="1" oninput="updateTime(this.value)">
                <p>year: <span id="currentYear">0</span></p>
            </div>
            
            <div class="chart-wrap">
                <canvas id="popChart"></canvas>
            </div>

            <div class="log-container">
                <table>
                    <thead><tr><th>year</th><th>pop</th><th>change</th></tr></thead>
                    <tbody id="logBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

    let chart;
    let history = [];

    function startSim() {
        document.getElementById('landing').classList.add('hidden');
        document.getElementById('simScreen').classList.remove('hidden');
        drawMeerkats(20); // Initial 20
    }

    function runSimulation() {
        const bRatio = parseFloat(document.getElementById('birthRatio').value) || 1;
        const dRatio = parseFloat(document.getElementById('deathRatio').value) || 1;
        const totalYears = parseInt(document.getElementById('years').value) || 1;
        
        let pop = 20;
        history = [pop];
        
        const logBody = document.getElementById('logBody');
        logBody.innerHTML = `<tr><td>0</td><td>20.00</td><td>-</td></tr>`;
        
        for (let i = 1; i <= totalYears; i++) {
            let births = pop / bRatio;
            let deaths = pop / dRatio;
            let change = births - deaths;
            
            pop = Math.max(0, pop - change);
            history.push(pop);
            
            let changeText = change >= 0 ? `+${change.toFixed(2)}` : `${change.toFixed(2)}`;
            logBody.innerHTML += `<tr><td>${i}</td><td>${pop.toFixed(2)}</td><td>${changeText}</td></tr>`;
        }

        document.getElementById('results').classList.remove('hidden');
        document.getElementById('yearSlider').max = totalYears;
        document.getElementById('yearSlider').value = 0;
        updateTime(0);
        renderChart();
    }

    function updateTime(val) {
        let currentPop = history[val];
        document.getElementById('currentYear').innerText = val;
        document.getElementById('currentPopDisplay').innerText = currentPop.toFixed(2);
        
        drawMeerkats(Math.floor(currentPop)); // Visual update
        
        if (chart) {
            chart.setActiveElements([{datasetIndex: 0, index: parseInt(val)}]);
            chart.update();
        }
    }


    function drawMeerkats(count) {
        const display = document.getElementById('meerkat-display');
        display.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const img = document.createElement('img');
            img.src = meerkatIcon;
            img.className = 'meerkat-unit';
            display.appendChild(img);
        }
    }

    function renderChart() {
        const ctx = document.getElementById('popChart').getContext('2d');
        if (chart) chart.destroy();
        
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: history.map((_, i) => "Year " + i),
                datasets: [{
                    label: 'Meerkat Population Count',
                    data: history,
                    borderColor: '#8d6e63',
                    backgroundColor: 'rgba(141, 110, 99, 0.2)',
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: 'Pop Count' } },
                    x: { title: { display: true, text: 'Years Elapsed' } }
                }
            }
        });
    }
    
</script>
</body>
</html>
